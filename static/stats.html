<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage stats</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .stats table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
    .stats th, .stats td { padding: 8px; border-bottom: 1px solid var(--line); text-align: right; }
    .stats th:first-child, .stats td:first-child, #reviews td:nth-child(2) { text-align: left; }
    .stats th { color: var(--muted); font-weight: 600; font-size: 12px; }
  </style>
</head>
<body>
  <main class="stats">
    <div class="narrow">
      <div class="stack">
        <h1>Usage stats</h1>
        <p class="lead" id="message">Loading…</p>
      </div>
      <section class="stack">
        <h2>Daily</h2>
        <div class="table"><table id="daily"></table></div>
      </section>
      <section class="stack">
        <h2>Weekly (from Monday)</h2>
        <div class="table"><table id="weekly"></table></div>
      </section>
      <section class="stack">
        <h2>Reviews</h2>
        <div class="table"><table id="reviews"></table></div>
      </section>
    </div>
  </main>
  <script>
    const HEADERS = ["Period", "New accounts", "Total accounts", "New applications", "Total applications"];
    const FIELDS = ["period", "accounts", "totalAccounts", "applications", "totalApplications"];
    const REVIEW_HEADERS = ["Date", "Comment", "E-mail"];
    const REVIEW_FIELDS = ["createdAt", "comment", "email"];

    function fill(table, rows, headers = HEADERS, fields = FIELDS) {
      table.replaceChildren();
      const head = table.insertRow();
      headers.forEach((text) => head.appendChild(document.createElement("th")).textContent = text);
      rows.forEach((row) => {
        const tr = table.insertRow();
        fields.forEach((field) => tr.insertCell().textContent = row[field]);
      });
    }

    async function onAuth(user) {
      const message = document.getElementById("message");
      if (!user) {
        message.innerHTML = 'Sign in on the <a class="link" href="/">main page</a> first.';
        return;
      }
      const response = await fetch("/api/stats");
      if (!response.ok) {
        message.textContent = response.status === 403 ? "This page is for administrators." : "Failed to load.";
        return;
      }
      const data = await response.json();
      message.textContent = "Accounts and applications created per day and per week. Deleted applications are not counted.";
      fill(document.getElementById("daily"), data.daily);
      fill(document.getElementById("weekly"), data.weekly);
      const reviews = await (await fetch("/api/reviews")).json();
      fill(document.getElementById("reviews"), reviews, REVIEW_HEADERS, REVIEW_FIELDS);
    }
  </script>
  <script type="module" src="/static/auth.js"></script>
</body>
</html>
